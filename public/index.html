<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Crack — TDUY DEV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1a0033 0%, #000 80%);
      color: #fff; font-family: 'Consolas', monospace;
      display: flex; align-items: center; justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,255,0.2);
      border-radius: 16px; padding: 40px; width: 90%; max-width: 600px;
      box-shadow: 0 0 60px rgba(0,255,255,0.1);
    }
    h1 {
      text-align: center; font-size: 24px; margin: 0 0 8px;
      color: #0ff; text-shadow: 0 0 10px #0ff;
      letter-spacing: 2px;
    }
    .subtitle { text-align: center; color: #555; font-size: 13px; margin-bottom: 30px; }
    label { display: block; margin-bottom: 8px; color: #0ff; font-size: 13px; }
    input {
      width: 100%; padding: 14px 16px; margin-bottom: 20px;
      background: #000; border: 1px solid #0ff; border-radius: 8px;
      color: #0ff; font-size: 15px; outline: none; font-family: inherit;
    }
    input:focus { box-shadow: 0 0 20px rgba(0,255,255,0.3); }
    button {
      width: 100%; padding: 16px; border: none; border-radius: 8px;
      background: linear-gradient(90deg, #0ff, #00f);
      color: #000; font-size: 16px; font-weight: bold; cursor: pointer;
      font-family: inherit; letter-spacing: 1px;
    }
    button:hover { box-shadow: 0 0 30px rgba(0,255,255,0.5); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result {
      margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,255,255,0.2); border-radius: 8px;
      font-size: 13px; line-height: 1.6; display: none; word-break: break-all;
    }
    .ok { color: #0f0; }
    .fail { color: #f44; }
    a { color: #0ff; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(0,255,255,0.3); border-top-color: #0ff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>WEB CRAWLER</h1>
    <p class="subtitle">Nhập URL, tải toàn bộ source code, nén ZIP. Chạy trên Render.</p>

    <label>URL Website</label>
    <input type="text" id="url" placeholder="Ví dụ: example.com" value="">

    <button id="btn" onclick="crawl()">BẮT ĐẦU CRAWL</button>

    <div id="result"></div>
  </div>

  <script>
    async function crawl() {
      const url = document.getElementById('url').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');

      if (!url) return alert('Nhập URL đi.');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Đang crawl...';
      result.style.display = 'block';
      result.innerHTML = '<p>Đang tải toàn bộ source...</p>';

      try {
        const res = await fetch('/api/crawl', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.error) {
          result.innerHTML = `<p class="fail">Lỗi: ${data.error}</p>`;
        } else {
          result.innerHTML = `
            <p class="ok">✅ Crawl xong!</p>
            <p>Tải file ZIP: <a href="${data.download}" target="_blank">${data.download}</a></p>
          `;
        }
      } catch (err) {
        result.innerHTML = `<p class="fail">Lỗi kết nối: ${err.message}</p>`;
      }

      btn.disabled = false;
      btn.innerHTML = 'BẮT ĐẦU CRAWL';
    }
  </script>
</body>
</html>
